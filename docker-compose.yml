# ==============================================================================
# NutriTrack AI — Full-Stack Docker Compose (Local & Production-Like Testing)
# Orchestrates: PostgreSQL 17, Python ViT Sidecar, Spring Boot Backend, Frontend
# ==============================================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: nutritrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nutritrack
      POSTGRES_USER: nutritrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutritrack -d nutritrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutritrack-network

  python-inference:
    build:
      context: ./Backend/inference
      dockerfile: Dockerfile
    container_name: nutritrack-inference
    restart: unless-stopped
    environment:
      - PORT=5001
      - HF_INFERENCE_HOST=0.0.0.0
      - DOCKER_CONTAINER=true
      - HF_LOCAL_FILES_ONLY=false
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - nutritrack-network

  backend:
    build:
      context: ./Backend/backend
      dockerfile: Dockerfile
    container_name: nutritrack-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-inference:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=8080
      - DB_URL=jdbc:postgresql://postgres:5432/nutritrack
      - DB_USERNAME=nutritrack
      - DB_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      - SCANNER_PROVIDER=huggingface
      - HF_INFERENCE_ENDPOINT=http://python-inference:5001/classify
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - JWT_SECRET=compose-dev-jwt-secret-must-be-at-least-32-bytes-long!
      - REFRESH_COOKIE_SECURE=false
      - REFRESH_COOKIE_SAMESITE=Lax
    ports:
      - "8081:8080"
    networks:
      - nutritrack-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8081
    container_name: nutritrack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - nutritrack-network

volumes:
  pgdata:
    driver: local

networks:
  nutritrack-network:
    driver: bridge
