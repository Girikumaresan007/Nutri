<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NutriTrack AI</title>
    <meta name="description" content="NutriTrack AI — a calm, intelligent companion for everyday nutrition, food logging, and workout tracking." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Color Theme -->
    <meta name="theme-color" content="#244C3A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#244C3A" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c3c2e" />

    <!-- Standard and Fallback Icons -->
    <link rel="icon" type="image/svg+xml" href="/nutritrack-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Apple iOS Mobile Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android & Windows Mobile Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NutriTrack AI" />
    <meta name="msapplication-TileColor" content="#244C3A" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        background-color: #F8F6EF;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(32px, env(safe-area-inset-bottom));
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
        min-height: 100dvh;
        box-sizing: border-box;
      }
      .splash-glow-sage {
        position: absolute;
        top: -110px;
        right: -110px;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168,197,160,0.38) 0%, rgba(168,197,160,0) 70%);
        filter: blur(50px);
        pointer-events: none;
      }
      .splash-glow-forest {
        position: absolute;
        bottom: -130px;
        left: -130px;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(36,76,58,0.22) 0%, rgba(36,76,58,0) 72%);
        filter: blur(55px);
        pointer-events: none;
      }
      .splash-glow-coral {
        position: absolute;
        bottom: 20%;
        right: 15%;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(240,138,112,0.18) 0%, rgba(240,138,112,0) 70%);
        filter: blur(45px);
        pointer-events: none;
      }
      .splash-mesh {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 38%, rgba(255,255,255,0.75) 0%, rgba(248,246,239,0.3) 55%, rgba(242,238,228,0.85) 100%);
        pointer-events: none;
      }
      .splash-card {
        position: relative;
        width: 106px;
        height: 106px;
        border-radius: 28px;
        padding: 10px;
        background: linear-gradient(180deg, #FFFFFF 0%, #F5F8F3 100%);
        border: 1.5px solid rgba(168, 197, 160, 0.45);
        box-shadow: 0 20px 45px -10px rgba(36, 76, 58, 0.22), 0 6px 18px rgba(36, 76, 58, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }
      .splash-card-halo {
        position: absolute;
        inset: -14px;
        border-radius: 36px;
        background: radial-gradient(circle, rgba(168,197,160,0.55) 0%, rgba(36,76,58,0.25) 55%, transparent 75%);
        filter: blur(16px);
        pointer-events: none;
      }
      .splash-leaf-badge {
        position: absolute;
        top: -8px;
        right: -8px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background-color: #FFFFFF;
        box-shadow: 0 4px 12px rgba(36, 76, 58, 0.14);
        border: 1px solid rgba(168, 197, 160, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      .splash-track {
        width: 210px;
        height: 5px;
        border-radius: 9999px;
        background-color: rgba(215, 228, 212, 0.75);
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(36, 76, 58, 0.08);
      }
      .splash-bar {
        width: 50%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #A8C5A0 0%, #244C3A 50%, #F08A70 100%);
        animation: splash-indeterminate 1.5s ease-in-out infinite;
      }
      @keyframes splash-indeterminate {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar {
          animation: none;
          width: 100%;
          background: #244C3A;
          opacity: 0.8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" aria-hidden="true">
        <!-- Ambient background glows -->
        <div class="splash-glow-sage"></div>
        <div class="splash-glow-forest"></div>
        <div class="splash-glow-coral"></div>
        <div class="splash-mesh"></div>

        <!-- Top pill -->
        <div style="position: relative; z-index: 10; width: 100%; display: flex; justify-content: center; padding-top: 8px;">
          <div style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px; border-radius: 9999px; background-color: rgba(255, 255, 255, 0.85); border: 1px solid rgba(36, 76, 58, 0.12); backdrop-filter: blur(8px);">
            <span style="width: 6px; height: 6px; border-radius: 50%; background-color: #244C3A;"></span>
            <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #315C47;">Nutrition &amp; Wellbeing</span>
          </div>
        </div>

        <!-- Center brand block -->
        <div style="position: relative; z-index: 10; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; margin-top: -8px;">
          <div style="position: relative; margin-bottom: 24px;">
            <div class="splash-card-halo"></div>
            <div class="splash-card">
              <svg style="width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(36,76,58,0.12));" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="128" height="128" rx="34" fill="#244C3A"/>
                <path d="M92 27C63 29 39 40 31 61c-7 18 3 37 21 39 27 4 46-23 40-73Z" fill="#A8C5A0"/>
                <path d="M32 96c12-18 29-33 53-48" fill="none" stroke="#FFFDF8" stroke-linecap="round" stroke-width="5"/>
                <path d="M50 73c2 8 8 14 17 17M61 60c8 1 15 5 20 11" fill="none" stroke="#FFFDF8" stroke-linecap="round" stroke-width="4"/>
                <circle cx="91" cy="28" r="5" fill="#F08A70"/>
              </svg>
            </div>
            <div class="splash-leaf-badge">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" fill="#315C47"/>
                <path d="M2 21c0-3 1.85-5.36 5.08-6" stroke="#A8C5A0" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
            <h1 style="font-family: 'Manrope', 'DM Sans', sans-serif; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.025em; color: #244C3A; margin: 0;">
              Nutri<span style="color: #315C47;">Track</span>
            </h1>
            <span style="display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background-color: #EBF3E8; color: #244C3A; border: 1px solid rgba(168,197,160,0.65); box-shadow: 0 1px 3px rgba(36,76,58,0.08);">AI</span>
          </div>

          <p style="font-size: 0.9375rem; font-weight: 500; color: #4A5C4C; letter-spacing: 0.01em; margin: 0; max-width: 280px;">
            Eat smarter. Live healthier.
          </p>
        </div>

        <!-- Bottom loading indicator -->
        <div style="position: relative; z-index: 10; width: 100%; max-width: 320px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding-bottom: 8px;">
          <div class="splash-track" role="progressbar" aria-label="Loading application">
            <div class="splash-bar"></div>
          </div>
          <p style="font-size: 12.5px; font-weight: 500; color: #5C6F5D; letter-spacing: 0.015em; margin: 12px 0 0; display: flex; align-items: center; gap: 6px;">
            <span>Preparing your nutrition dashboard…</span>
          </p>
          <div style="margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; color: #768777; letter-spacing: 0.01em;">
            <span style="width: 5px; height: 5px; border-radius: 50%; background-color: #A8C5A0;"></span>
            <span>Private &amp; Secure Health Companion</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
