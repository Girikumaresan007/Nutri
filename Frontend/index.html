<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NutriTrack AI</title>
    <meta name="description" content="NutriTrack AI — a calm, intelligent companion for everyday nutrition, food logging, and workout tracking." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Color Theme -->
    <meta name="theme-color" content="#244C3A" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#244C3A" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c3c2e" />

    <!-- Standard and Fallback Icons -->
    <link rel="icon" type="image/svg+xml" href="/nutritrack-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Apple iOS Mobile Web App Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android & Windows Mobile Metadata -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="NutriTrack AI" />
    <meta name="msapplication-TileColor" content="#244C3A" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
