# PRODUCTION CONFIGURATION (application-prod.yml)
# All secrets and environment-specific endpoints MUST be supplied via environment variables.

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework   # honour X-Forwarded-Proto, X-Forwarded-For from trusted reverse proxy / CDN

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 120000              # 2 minutes
      max-lifetime: 600000             # 10 minutes (prevents dead connections dropped by Supabase/firewalls)
      connection-timeout: 30000         # 30 seconds
      keepalive-time: 30000             # 30 seconds (proactively keeps connection alive across cloud NATs)
      validation-timeout: 5000          # 5 seconds
      leak-detection-threshold: 30000   # 30 seconds
      pool-name: NutriTrackHikariProdPool
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never               # Never disclose system internals or database IP in production health checks

nutritrack:
  refresh-token:
    cookie-secure: true                 # Enforces Secure flag for HTTPS
    cookie-same-site: ${REFRESH_COOKIE_SAMESITE:None}
    cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    cookie-partitioned: ${REFRESH_COOKIE_PARTITIONED:true}
  scanner:
    provider: ${SCANNER_PROVIDER:huggingface}
