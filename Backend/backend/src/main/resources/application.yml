# Common configuration. Profile files (application-dev.yml / application-prod.yml) supply environment specifics.
spring:
  application:
    name: nutritrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway; Hibernate only validates it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: ${SCANNER_MAX_FILE_SIZE:10MB}
      max-request-size: ${SCANNER_MAX_REQUEST_SIZE:11MB}
      file-size-threshold: 12MB   # keeps accepted uploads in memory; nothing is spooled to disk
  mvc:
    log-request-details: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO

nutritrack:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    issuer: nutritrack-ai
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:14d}
    cookie-name: nt_refresh
    cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    cookie-same-site: ${REFRESH_COOKIE_SAMESITE:None}
    cookie-path: /api/v1/auth
    cookie-domain: ${REFRESH_COOKIE_DOMAIN:}
    cookie-partitioned: ${REFRESH_COOKIE_PARTITIONED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
  rate-limit:
    auth-attempts: ${RATE_LIMIT_AUTH_ATTEMPTS:10}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:15m}
    scanner-requests: ${RATE_LIMIT_SCANNER_REQUESTS:20}
    scanner-window: ${RATE_LIMIT_SCANNER_WINDOW:1m}
  scanner:
    provider: ${SCANNER_PROVIDER:none}     # none | mock (dev only) | anthropic | huggingface
    max-file-size: ${SCANNER_MAX_FILE_SIZE:10MB}
    anthropic:
      endpoint: ${AI_ENDPOINT:https://api.anthropic.com}
      api-key: ${AI_API_KEY:}
      model: ${AI_MODEL:claude-sonnet-5-5}
      max-tokens: ${AI_MAX_TOKENS:1500}
      timeout: ${AI_TIMEOUT:45s}
    huggingface:
      endpoint: ${HF_INFERENCE_ENDPOINT:http://127.0.0.1:5001/classify}
      api-token: ${HF_TOKEN:}
      timeout: ${HF_TIMEOUT:15s}
      min-confidence: ${HF_MIN_CONFIDENCE:0.25}
  nutrition:
    lose-adjustment: -500
    gain-adjustment: 300
    muscle-adjustment: 250
    minimum-daily-calories: 1200
    fat-percent: 0.28
    protein-per-kg-lose: 1.8
    protein-per-kg-maintain: 1.4
    protein-per-kg-gain: 1.6
    protein-per-kg-muscle: 2.0
    fiber-per-1000-kcal: 14
