# LOCAL DEVELOPMENT ONLY. Values below are insecure defaults and are rejected in the prod profile.

server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutritrack}
    username: ${DB_USERNAME:nutritrack}
    password: ${DB_PASSWORD:nutritrack}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

nutritrack:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
  refresh-token:
    cookie-secure: false
    cookie-same-site: Lax
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  security:
    bcrypt-strength: 10
  scanner:
    provider: ${SCANNER_PROVIDER:huggingface}
  rate-limit:
    auth-attempts: ${RATE_LIMIT_AUTH_ATTEMPTS:1000}
    auth-window: ${RATE_LIMIT_AUTH_WINDOW:1m}
    scanner-requests: ${RATE_LIMIT_SCANNER_REQUESTS:1000}
    scanner-window: ${RATE_LIMIT_SCANNER_WINDOW:1m}

